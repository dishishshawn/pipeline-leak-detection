data:
  path: "data/sample/realtime_training_data.csv"
  dataset_name: "scada_pipeline"
  sample_size: null

feature_selection:
  include_columns:
    - "pressure"
    - "flow_rate"
    - "temperature"
    - "pump_speed"
    - "energy_consumption"
    - "pressure_delta"
    - "flow_rate_delta"
    - "pressure_roll_mean"
    - "pressure_roll_std"
    - "flow_roll_mean"
    - "flow_roll_std"
    - "pressure_pct_delta"
    - "flow_pct_delta"
    - "pressure_flow_ratio"
    - "pressure_roll_z"
    - "flow_roll_z"
    - "pressure_delta_deviation"
    - "flow_neg_streak"
    - "pressure_segment_deviation"
    - "flow_segment_deviation"
    - "pressure_baseline_dev"
    - "flow_baseline_dev"
    - "pressure_roll30_std"
    - "flow_roll30_std"
    - "pressure_cusum_neg30"
    - "pressure_flow_divergence"
    - "pressure_neg_streak15"
    - "pressure_ema_dev"
    - "flow_ema_dev"
    - "pressure_accel"
    - "flow_cusum_neg30"
    - "pressure_baseline_pct"
    - "pressure_baseline60_dev"
    - "flow_baseline60_dev"
    - "pressure_expanding_dev"
    - "flow_expanding_dev"
  exclude_columns:
    - "event_type_encoded"
    - "leak_severity"
    - "pump_efficiency"

training:
  random_state: 42
  test_size: 0.2
  validation_size: 0.2
  n_folds: 5

models:
  random_forest:
    params:
      n_estimators: 400
      max_depth: 12
      min_samples_leaf: 2
      random_state: 42
      n_jobs: 1
      class_weight: "balanced_subsample"

  xgboost:
    params:
      n_estimators: 1200
      max_depth: 9
      learning_rate: 0.02
      subsample: 0.80
      colsample_bytree: 0.80
      reg_lambda: 1.0
      reg_alpha: 0.05
      min_child_weight: 2
      gamma: 0.05
      max_delta_step: 1
      random_state: 42
      n_jobs: 1

  lightgbm:
    params:
      n_estimators: 500
      max_depth: -1
      learning_rate: 0.03
      num_leaves: 63
      min_child_samples: 5
      min_sum_hessian_in_leaf: 0.001
      subsample: 0.85
      colsample_bytree: 0.85
      reg_alpha: 0.05
      is_unbalance: true
      random_state: 42
      n_jobs: 1

  isolation_forest:
    params:
      n_estimators: 300
      contamination: 0.08
      random_state: 42
      n_jobs: 1
      alert_threshold: 0.55

  hybrid_ensemble:
    include_models:
      - "realtime_random_forest"
      - "realtime_xgboost"
      - "realtime_lightgbm"
      - "realtime_isolation_forest"
    threshold: 0.5

output:
  model_dir: "models/realtime"
  log_level: "INFO"
