data:
  path: "data/sample/realtime_training_data.csv"
  dataset_name: "scada_pipeline"
  sample_size: null

feature_selection:
  include_columns:
    - "pressure"
    - "flow_rate"
    - "temperature"
    - "pump_speed"
    - "energy_consumption"
    - "pressure_delta"
    - "flow_rate_delta"
    - "pressure_roll_mean"
    - "pressure_roll_std"
    - "flow_roll_mean"
    - "flow_roll_std"
  exclude_columns:
    - "event_type_encoded"
    - "leak_severity"
    - "pump_efficiency"

training:
  random_state: 42
  test_size: 0.2
  validation_size: 0.2

models:
  random_forest:
    params:
      n_estimators: 400
      max_depth: 12
      min_samples_leaf: 2
      random_state: 42
      n_jobs: 1
      class_weight: "balanced_subsample"

  xgboost:
    params:
      n_estimators: 300
      max_depth: 5
      learning_rate: 0.05
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.0
      random_state: 42
      n_jobs: 1

  lightgbm:
    params:
      n_estimators: 350
      max_depth: -1
      learning_rate: 0.05
      num_leaves: 31
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      n_jobs: 1

  isolation_forest:
    params:
      n_estimators: 300
      contamination: 0.08
      random_state: 42
      n_jobs: 1
      alert_threshold: 0.55

  hybrid_ensemble:
    include_models:
      - "realtime_random_forest"
      - "realtime_xgboost"
      - "realtime_lightgbm"
      - "realtime_isolation_forest"
    threshold: 0.5

output:
  model_dir: "models/realtime"
  log_level: "INFO"
