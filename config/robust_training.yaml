data:
  path: "data/processed/robust_realtime/robust_realtime_training_data.csv"
  dataset_name: "robust_realtime"
  sample_size: null

feature_selection:
  include_columns:
    - "pressure_delta"
    - "flow_rate_delta"
    - "pressure_pct_delta"
    - "flow_pct_delta"
    - "pressure_roll_z"
    - "flow_roll_z"
    - "pressure_flow_ratio"
  exclude_columns:
    - "event_type_encoded"
    - "alarm_triggered"
    - "leak_severity"
    - "pump_efficiency"

training:
  random_state: 42
  test_size: 0.2
  validation_size: 0.2

models:
  random_forest:
    params:
      n_estimators: 500
      max_depth: 14
      min_samples_leaf: 2
      random_state: 42
      n_jobs: 1
      class_weight: "balanced_subsample"

  xgboost:
    params:
      n_estimators: 450
      max_depth: 5
      learning_rate: 0.04
      subsample: 0.9
      colsample_bytree: 0.9
      reg_lambda: 1.2
      random_state: 42
      n_jobs: 1

  lightgbm:
    params:
      n_estimators: 450
      max_depth: -1
      learning_rate: 0.04
      num_leaves: 31
      subsample: 0.9
      colsample_bytree: 0.9
      random_state: 42
      n_jobs: 1

  isolation_forest:
    params:
      n_estimators: 350
      contamination: 0.06
      random_state: 42
      n_jobs: 1
      alert_threshold: 0.58

  hybrid_ensemble:
    include_models:
      - "realtime_random_forest"
      - "realtime_xgboost"
      - "realtime_lightgbm"
      - "realtime_isolation_forest"
    threshold: 0.5

output:
  model_dir: "models/robust"
  log_level: "INFO"
